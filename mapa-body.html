<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa dětských bodů — zatmění 2026 (Španělsko)</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root{--gold:#b4610b;--ink:#161b38;--panel:#ffffff;--line:#d9deef}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink)}
  #app{display:flex;flex-direction:column;height:100%}
  header{padding:.55rem .8rem;background:#0e1330;color:#fff;display:flex;flex-wrap:wrap;gap:.5rem .9rem;align-items:center}
  header h1{font-size:1rem;margin:0;font-weight:600;white-space:nowrap}
  header .sub{font-size:.78rem;color:#aab0d8}
  .bar{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
  .bar .grp{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
  button.reg{font:600 .8rem/1 system-ui;padding:.4rem .6rem;border-radius:999px;border:1px solid #3a4270;background:#1a2149;color:#e8 eaf7;color:#e8eaf7;cursor:pointer}
  button.reg:hover{background:#26305e}
  button.reg.active{background:var(--gold);border-color:var(--gold);color:#fff}
  .cat{display:inline-flex;align-items:center;gap:.3rem;font-size:.8rem;background:#1a2149;border:1px solid #3a4270;border-radius:999px;padding:.28rem .55rem;cursor:pointer;user-select:none;color:#e8eaf7}
  .cat input{accent-color:var(--gold);margin:0}
  .cat .sw{width:.7rem;height:.7rem;border-radius:50%;display:inline-block}
  #map{flex:1;min-height:0}
  .note{background:#fff7e6;color:#5a4a1e;border-bottom:1px solid #f0dca8;padding:.45rem .8rem;font-size:.82rem}
  .note b{color:#8a5a00}
  .note a{color:#8a5a00}
  .pin{width:26px;height:26px;border-radius:50% 50% 50% 2px;transform:rotate(45deg);display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.4);border:2px solid #fff}
  .pin span{transform:rotate(-45deg);font-size:14px;line-height:1}
  .leaflet-popup-content{font-size:.9rem;line-height:1.4;margin:.7rem .9rem}
  .leaflet-popup-content b{font-size:.95rem}
  .pop-cat{display:inline-block;font-size:.72rem;font-weight:600;padding:.05rem .4rem;border-radius:6px;color:#fff;margin-bottom:.25rem}
  .pop-meta{color:#667;font-size:.78rem;margin-top:.35rem;font-family:ui-monospace,Menlo,monospace}
  .pop-meta a{color:var(--gold)}
  @media (max-width:620px){header h1{font-size:.9rem}.sub{display:none}}
</style>
</head>
<body>
<div id="app">

        <button class="reg" data-r="coast">Pobřeží</button>
        <button class="reg" data-r="ebro">Ebro / Rioja</button>
      </div>
    </div>
    <div class="bar" id="cats"></div>
  </header>
  <div class="note" id="keynote"></div>
  <div id="map"></div>
</div>

  {r:"meseta",c:"swim",n:"Embalse de Ruesga (Cervera)", note:"Menší horská přehrada u Cervery — klid a chládek, hned u tvého páramo bodu.", lat:42.860,lng:-4.510},

  {r:"ebro",c:"swim",n:"Embalse González Lacasa (Rioja)", note:"Horská přehrada u Ortigosy — koupání a pláž.", lat:42.160,lng:-2.650},

  {r:"meseta",c:"fun",n:"Canal de Castilla — loď (Herrera de Pisuerga)", note:"Plavba lodí Marqués de la Ensenada po historickém kanálu ke zdymadlu, ~5 €. Pro malé děti paráda.", lat:42.590,lng:-4.330},
  {r:"meseta",c:"fun",n:"Las Médulas (León)", note:"Rudé skalní věže — pozůstatek římských zlatých dolů (UNESCO). Jeskyně a vyhlídky.", lat:42.460,lng:-6.770},
  {r:"meseta",c:"fun",n:"Mirador de Valcabado", note:"Balkon z okraje páramo nad údolím Valderredible — výhled na SEVER (na zatmění nevhodné, ale nádherné).", lat:42.800,lng:-4.050},
  {r:"meseta",c:"fun",n:"Aguilar de Campoo (sušenky + klášter)", note:"Městečko s hradem nad ním, klášter Santa María la Real, „město sušenek“.", lat:42.795,lng:-4.260},
  {r:"meseta",c:"nature",n:"Cañón del Ebro (Pesquera de Ebro)", note:"Vápencový kaňon se supy a klidnými vesničkami.", lat:42.780,lng:-3.770},

  {r:"ebro",c:"camp",n:"Área autocaravanas Arguedas", note:"Zdarma, 5 km od Bardenas, výlevka i voda — legální nocleh po výletě do polopouště.", lat:42.180,lng:-1.600},
  {r:"ebro",c:"fun",n:"Mallos de Riglos (Huesca)", note:"Obří rudé skalní věže nad vesnicí, hnízdí tu supi — dech beroucí.", lat:42.350,lng:-0.720},
  {r:"ebro",c:"nature",n:"Foz de Lumbier (Navarra)", note:"Krátká soutěska po staré železnici s tunely a supy — ideální délka pro děti.", lat:42.650,lng:-1.300},
  {r:"ebro",c:"nature",n:"Selva de Irati", note:"Rozlehlý bukový prales, chladno a stín i v srpnu.", lat:42.980,lng:-1.100},

const BOUNDS = {
  all:    [[40.25,-6.85],[43.70,-0.20]],
  madrid: [[40.25,-4.40],[41.05,-3.55]],
  meseta: [[41.70,-6.00],[43.10,-3.55]],
  soria:  [[41.60,-3.30],[42.30,-1.55]],
  picos:  [[43.00,-6.10],[43.45,-4.55]],
  coast:  [[43.25,-5.95],[43.70,-3.75]],
  ebro:   [[41.50,-2.80],[43.00,-0.20]]
};

/* ---- základní vrstva ---- */
const map = L.map('map',{zoomControl:true}).setView([42.6,-4.3],6);
const useMapy = MAPY_KEY.trim().length > 0;
const keynote = document.getElementById('keynote');

const NOTE = ' <span style="opacity:.85">📍 Souřadnice orientační (ověř odkazem v bublině). 🏜️ Nocleh: toleruje se <b>parkování</b>, ne rozložený kemping; v NP a na plážích zakázáno.</span>';

function osmLayer(){
  return L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    {maxZoom:19, attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'});
}
let base, swapped=false;
function fallbackToOSM(msg){
  if(swapped) return; swapped=true;
  try{ map.removeLayer(base); }catch(e){}
  osmLayer().addTo(map);
  keynote.innerHTML='⚠️ <b>'+msg+'</b> — přepnuto na OpenStreetMap.'+NOTE;
}
if(useMapy){
  base = L.tileLayer('https://api.mapy.cz/v1/maptiles/outdoor/256/{z}/{x}/{y}?apikey='+encodeURIComponent(MAPY_KEY),
    {maxZoom:19, attribution:'&copy; <a href="https://mapy.cz/" target="_blank">Seznam.cz, a.s.</a> a další'});
  // povinné logo mapy.cz
  const Logo = L.Control.extend({options:{position:'bottomleft'},onAdd:function(){
    const a=L.DomUtil.create('a'); a.href='https://mapy.cz/'; a.target='_blank';
    a.style.cssText='display:block;margin:0 0 4px 4px';
    a.innerHTML='<img src="https://api.mapy.cz/img/api/logo.svg" alt="mapy.cz" style="height:18px;display:block">';
    return a;
  }});
  map.addControl(new Logo());
  // když klíč nefunguje (403 / limit), spadni na OSM
  base.on('tileerror',function(){ fallbackToOSM('Dlaždice mapy.cz se nenačetly'); });
  keynote.innerHTML='✅ Podklad <b>mapy.cz (outdoor)</b>.'+NOTE;
}else{
  base = osmLayer();
  keynote.innerHTML='ℹ️ <b>OpenStreetMap</b> — pro mapy.cz vlož klíč do <b>MAPY_KEY</b>.'+NOTE;
}
base.addTo(map);

// pojistka: když do 5 s nenaběhne ani jedna dlaždice, přepni na OSM
if(useMapy){
  setTimeout(function(){
    var ok=[].slice.call(document.querySelectorAll('.leaflet-tile')).some(function(i){return i.complete && i.naturalWidth>0;});
    if(!ok) fallbackToOSM('Podklad mapy.cz nedostupný (klíč/doména?)');
  },5000);
}

/* ---- markery po kategoriích ---- */
function pinIcon(color,emoji){
  return L.divIcon({className:'', html:'<div class="pin" style="background:'+color+'"><span>'+emoji+'</span></div>',
    iconSize:[26,26], iconAnchor:[13,24], popupAnchor:[0,-22]});
}
const groups={};
Object.keys(CATS).forEach(k=>groups[k]=L.layerGroup().addTo(map));

POIS.forEach(p=>{
  const cat=CATS[p.c]; const emoji=cat.label.split(' ')[0];
  const q=encodeURIComponent(p.n.split('—')[0].split('(')[0].trim());
  const m=L.marker([p.lat,p.lng],{icon:pinIcon(cat.color,emoji)});
  m.bindPopup(
    '<span class="pop-cat" style="background:'+cat.color+'">'+cat.label+'</span><br>'+
    '<b>'+p.n+'</b><br>'+p.note+
    '<div class="pop-meta">'+p.lat.toFixed(4)+', '+p.lng.toFixed(4)+
    ' · <a href="https://mapy.cz/zakladni?q='+q+'" target="_blank">mapy.cz</a>'+
    ' · <a href="https://www.google.com/maps/search/'+q+'" target="_blank">google</a></div>'
  );
  m.addTo(groups[p.c]);
});

/* ---- ovládání: kategorie ---- */
const catsBar=document.getElementById('cats');
Object.entries(CATS).forEach(([k,v])=>{
  const l=document.createElement('label'); l.className='cat';
  l.innerHTML='<input type="checkbox" checked> <span class="sw" style="background:'+v.color+'"></span>'+v.label;
  l.querySelector('input').addEventListener('change',e=>{
    if(e.target.checked) groups[k].addTo(map); else map.removeLayer(groups[k]);
  });
  catsBar.appendChild(l);
});

/* ---- ovládání: regiony ---- */
document.querySelectorAll('button.reg').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('button.reg').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    map.flyToBounds(BOUNDS[b.dataset.r],{padding:[20,20],duration:.6});
  });
});

/* dorovnání velikosti kontejneru a napasování na celou cestu
   (počkej, až má mapa reálnou výšku, jinak fitBounds spadne na maxZoom) */
function fitAll(){ map.invalidateSize(); if(map.getSize().y<80){ setTimeout(fitAll,120); return; } map.fitBounds(BOUNDS.all,{padding:[20,20]}); }
setTimeout(fitAll,150);
window.addEventListener('load',fitAll);
</script>
</body>
